<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FF85A1">
    <meta name="description" content="離線也能查看的旅行行程規劃工具">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="旅行筆記">
    <title>專屬你的旅行筆記</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="vendor/tailwind.css">
    <link rel="stylesheet" href="vendor/fonts/jf-openhuninn.css">
    <link rel="stylesheet" href="vendor/fonts/noto-sans-tc.css">
    <link rel="stylesheet" href="vendor/fontawesome/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="css/cute.css">
</head>
<body>
    <div id="app-boot" class="app-boot" aria-live="polite">載入中…</div>

    <div id="status-banner-stack" class="status-banner-stack hidden" role="status" aria-live="polite"></div>

    <input type="file" id="banner-img-input" class="hidden" accept="image/*">
    <input type="file" id="event-img-input" class="hidden" accept="image/*">
    <input type="file" id="lib-file-input" class="hidden" accept="image/*,application/pdf,.pdf">
    <input type="file" id="backup-file-input" class="hidden" accept="application/json,.json">
    <div id="lightbox" role="dialog" aria-label="圖片預覽">
        <button type="button" id="lightbox-close" onclick="closeLightbox()" aria-label="關閉"><i class="fas fa-times"></i></button>
        <div id="lightbox-viewport">
            <img id="lightbox-img" alt="預覽">
        </div>
    </div>

    <div id="toast" role="status"></div>

    <!-- Header -->
    <header class="app-header sticky top-0 z-50 glass border-b border-default px-4 py-3 flex justify-between items-center relative">
        <div class="flex items-center gap-2 overflow-hidden min-w-0 flex-1">
            <button type="button" id="header-title-btn" class="header-title-btn" onclick="toggleHeaderMenu()" aria-label="切換旅程" aria-expanded="false" aria-controls="header-menu">
                <span class="header-title-row">
                    <span id="trip-title" class="truncate">我的旅行</span>
                    <i class="fas fa-chevron-down header-title-caret" aria-hidden="true"></i>
                </span>
                <span id="header-subtitle" class="truncate">開始規劃！</span>
            </button>
        </div>
        <button type="button" id="cloud-chip" class="cloud-chip hidden" onclick="openSettingsSheet()" aria-label="雲端同步">☁️</button>
        <button type="button" id="travel-mode-chip" class="travel-mode-chip hidden" onclick="openSettingsSheet()" aria-label="出門模式開緊，撳入設定關閉">🧳 出門中</button>
        <button type="button" id="header-settings-btn" onclick="openSettingsSheet()" class="header-mode-btn header-icon-btn flex-shrink-0" aria-label="設定" aria-haspopup="dialog" aria-controls="settings-sheet">
            <i class="fas fa-gear" aria-hidden="true"></i>
        </button>
        <div id="header-menu" class="hidden" role="dialog" aria-label="我的旅程">
            <p class="header-menu-title"><span aria-hidden="true">✈️</span> 我的旅程</p>
            <div id="trip-picker" class="trip-picker" role="listbox" aria-label="選擇旅程"></div>
            <button type="button" class="trip-search-btn" onclick="closeHeaderMenu(); openTripSearch();"><i class="fas fa-search" aria-hidden="true"></i>搜尋全旅程景點、備註、訂位編號</button>
            <div class="trip-menu-actions">
                <button type="button" onclick="closeHeaderMenu(); shareCurrentTrip();"><i class="fas fa-share-alt" aria-hidden="true"></i>分享</button>
                <button type="button" onclick="closeHeaderMenu(); printCurrentTrip();"><i class="fas fa-print" aria-hidden="true"></i>列印／PDF</button>
            </div>
            <button type="button" class="trip-add-btn" onclick="closeHeaderMenu(); createNewTrip();"><i class="fas fa-plus" aria-hidden="true"></i>新旅程</button>
            <label class="header-menu-dest">
                <span class="header-menu-dest-label"><span aria-hidden="true">📍</span> 目的地</span>
                <select id="weather-location-select" onchange="onWeatherLocationSelect(this.value)" class="header-menu-dest-select" aria-label="呢個旅程嘅目的地（天氣用）"></select>
            </label>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">
        <section id="content-itinerary" class="space-y-2 flex flex-col tab-panel">
            <div id="itinerary-sticky-bar" class="itinerary-sticky-bar">
                <div id="edit-controls" class="itinerary-edit-actions hidden">
                    <button type="button" id="trip-date-chip" class="edit-chip" onclick="openTripDatePicker()" aria-haspopup="dialog" aria-controls="trip-date-picker"><i class="fas fa-calendar-alt" aria-hidden="true"></i><span id="trip-date-chip-text">設定日期</span></button>
                    <button type="button" id="add-day-btn" onclick="addDay()" class="edit-chip edit-chip-ghost" aria-label="新增一天"><i class="fas fa-plus" aria-hidden="true"></i>一天</button>
                </div>
                <div class="itinerary-sticky-tools">
                    <button type="button" id="itinerary-edit-btn" class="edit-done-btn hidden" onclick="toggleEdit()" aria-label="完成編輯">
                        <i class="fas fa-check" aria-hidden="true"></i>完成
                    </button>
                </div>
            </div>

            <div id="search-panel" class="hidden space-y-2">
                <div id="search-wrap" class="search-field">
                    <label class="sr-only" for="search-input">搜尋全旅程景點與備註</label>
                    <span class="search-field-icon" aria-hidden="true"><i class="fas fa-search"></i></span>
                    <input type="text" id="search-input" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" oninput="onSearchInput(this.value)" placeholder="搜尋景點、備註、訂位編號…" class="search-field-input">
                    <button type="button" id="search-clear" onclick="clearSearch()" class="search-field-clear hidden" aria-label="清除搜尋"><i class="fas fa-times-circle"></i></button>
                </div>
                <div id="search-results" class="hidden bg-surface rounded-2xl border border-default overflow-hidden"></div>
            </div>

            <div class="flex overflow-x-auto no-scrollbar px-1" id="day-selector"></div>

            <div id="main-day-card" class="bg-white rounded-[1.5rem] overflow-hidden relative">
                <div id="day-banner" class="day-banner day-banner-date-only relative bg-gray-200 group">
                    <div id="day-banner-date" class="day-banner-date">
                        <div class="day-banner-row">
                            <p id="day-banner-date-main" class="day-banner-date-main">Day 1</p>
                            <p id="day-banner-date-sub" class="day-banner-date-sub"></p>
                            <span id="day-banner-today-mark" class="day-banner-today-mark hidden">✿ 今日</span>
                            <div id="day-banner-weather" class="day-banner-weather hidden" aria-label="當日天氣">
                                <span id="day-banner-weather-icon" class="day-banner-weather-icon" aria-hidden="true"></span>
                                <span id="day-banner-weather-temp" class="day-banner-weather-temp"></span>
                                <span id="day-banner-weather-mood" class="day-banner-weather-mood"></span>
                            </div>
                            <span class="day-banner-tools">
                                <button type="button" id="day-date-btn" class="day-date-btn hidden" onclick="openTripDatePicker()"><span aria-hidden="true">📅</span> 設定日期</button>
                                <button type="button" id="day-edit-btn" class="day-icon-btn" onclick="toggleEdit()" aria-label="編輯行程"><i class="fas fa-pen" aria-hidden="true"></i></button>
                            </span>
                        </div>
                        <p id="day-banner-title" class="day-banner-title hidden"></p>
                    </div>
                    <img id="day-img" src="" alt="" class="day-banner-photo w-full h-full object-cover">
                    <div class="day-banner-photo absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
                    <div class="hidden absolute top-4 right-4 flex gap-2" id="day-banner-actions">
                        <button type="button" onclick="copyCurrentDay()" class="btn-banner-action" title="複製整天行程" aria-label="複製整天行程"><i class="fas fa-copy"></i><span>複製</span></button>
                        <button type="button" id="btn-upload-banner" onclick="triggerFile('banner-img-input')" class="btn-banner-action" title="更換當日封面" aria-label="更換當日封面"><i class="fas fa-camera"></i><span>封面</span></button>
                    </div>

                    <div class="day-banner-footer absolute bottom-4 left-5 right-5 text-white">
                        <span id="day-label" class="day-banner-chip mb-2 inline-block">Day Info</span>
                        <div id="day-title-box"></div>
                    </div>
                </div>

                <div class="day-card-body relative">
                    <h2 id="day-title-display" class="day-title-display hidden"></h2>
                    <div id="day-title-edit-panel" class="day-heading-edit hidden">
                        <label for="day-title-input" class="sr-only">當日標題</label>
                        <input type="text" id="day-title-input" placeholder="當日標題" class="day-heading-input" aria-label="當日標題">
                        <button type="button" id="day-stay-add" class="day-icon-btn hidden" onclick="openStaySheet(null, curDayIdx)" aria-label="加今晚住宿" title="加今晚住宿"><i class="fas fa-bed" aria-hidden="true"></i></button>
                    </div>
                    <div id="day-stay" class="day-stay hidden"></div>
                    <div id="timeline" class="space-y-5 relative min-h-[50px]"></div>
                </div>
            </div>
        </section>

        <!-- Tools Tab -->
        <section id="content-tools" class="hidden space-y-4 pb-10 tab-panel">
            <div class="tools-travel-stack">
            <div id="tools-rate-card" class="tools-widget-card bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm space-y-2">
                <h2 class="type-body font-heavy text-primary"><span class="cute-emoji" aria-hidden="true">💱</span>匯率</h2>
                <div class="rate-calc">
                    <label class="rate-calc-field">
                        <select id="local-currency-select" onchange="onLocalCurrencySelect(this.value)" class="rate-calc-cur" aria-label="目的地貨幣"></select>
                        <input type="number" id="curr-local" oninput="convert('local')" placeholder="0" class="rate-calc-input" inputmode="decimal" aria-label="目的地金額">
                    </label>
                    <button type="button" onclick="swapCurrencies()" class="rate-calc-swap" aria-label="對調貨幣"><i class="fas fa-right-left" aria-hidden="true"></i></button>
                    <label class="rate-calc-field">
                        <select id="home-currency-select" onchange="onHomeCurrencySelect(this.value)" class="rate-calc-cur" aria-label="本國貨幣"></select>
                        <input type="number" id="curr-home" oninput="convert('home')" placeholder="0" class="rate-calc-input" inputmode="decimal" aria-label="本國金額">
                    </label>
                </div>
                <div class="rate-line-row">
                    <p id="rate-line" class="type-micro text-muted font-bold min-w-0 truncate">1 JPY = -- HKD</p>
                    <span id="rate-detail" class="hidden type-micro text-muted truncate"></span>
                    <span id="rate-loading" aria-hidden="true">●</span>
                    <button type="button" onclick="refreshRate(true)" class="rate-refresh-btn" aria-label="刷新匯率"><i class="fas fa-rotate-right text-secondary type-micro" aria-hidden="true"></i></button>
                </div>
            </div>
            </div>

            <div id="tools-stays-card" class="bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm">
                <div class="tools-card-head flex justify-between items-center mb-3">
                    <h2 class="type-body font-heavy text-primary"><span class="cute-emoji" aria-hidden="true">🏨</span>住宿<span class="card-empty-tag">未有</span></h2>
                    <button type="button" onclick="openStaySheet()" class="type-micro font-heavy text-pink-500 px-3 py-1.5 bg-pink-50 rounded-xl">＋ 新增</button>
                </div>
                <div id="stays-list" class="space-y-2"></div>
            </div>

            <div id="tools-docs-card" class="bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm">
                <div class="tools-card-head flex justify-between items-center mb-4">
                    <h2 class="type-body font-heavy text-primary"><span class="cute-emoji" aria-hidden="true">📄</span>重要文件<span class="card-empty-tag">未有</span></h2>
                    <button type="button" id="btn-upload-doc" onclick="triggerFile('lib-file-input')" class="hidden btn-primary-sm chip-label px-3 py-2">上傳</button>
                </div>
                <div id="doc-list" class="grid grid-cols-2 gap-4"></div>
            </div>

            <div id="tools-checklist-card" class="bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm">
                <div class="flex justify-between items-center mb-2">
                    <h2 class="type-body font-heavy text-primary"><span class="cute-emoji" aria-hidden="true">🧳</span>行李清單</h2>
                </div>
                <div id="check-progress-wrap" class="hidden mb-4">
                    <div class="flex justify-between type-micro font-heavy text-secondary mb-1">
                        <span id="check-progress-text"></span>
                    </div>
                    <div class="progress-track"><div id="check-progress-fill" class="progress-fill" style="width:0%"></div></div>
                </div>
                <div id="check-templates" class="hidden flex flex-wrap gap-2 mb-4">
                    <button type="button" onclick="applyCheckTemplate('short')" class="chip-label px-3 py-1.5 bg-pink-50 text-pink-600 rounded-xl">輕旅行</button>
                    <button type="button" onclick="applyCheckTemplate('winter')" class="chip-label px-3 py-1.5 bg-pink-50 text-pink-600 rounded-xl">冬季</button>
                    <button type="button" onclick="applyCheckTemplate('business')" class="chip-label px-3 py-1.5 bg-pink-50 text-pink-600 rounded-xl">出差</button>
                </div>
                <div id="check-list" class="space-y-3"></div>
                <form id="check-add-form" class="check-add-form hidden" onsubmit="event.preventDefault(); addCheckInline();">
                    <label for="check-add-input" class="sr-only">加一項</label>
                    <input type="text" id="check-add-input" class="check-add-input" placeholder="＋ 加一項…" autocomplete="off" enterkeyhint="done">
                </form>
            </div>

        </section>

    </main>

    <button type="button" id="fab-quick-add" onclick="quickAddEvent()" class="hidden" aria-label="快速新增景點">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Navigation -->
    <nav class="app-bottom-nav" aria-label="主選單">
        <button type="button" onclick="setTab('itinerary')" id="nav-itinerary" class="nav-tab-active flex-1 py-3 flex flex-col items-center gap-0.5 rounded-[2rem]">
            <span class="nav-emoji" aria-hidden="true">🗺️</span>
            <span class="nav-tab-label">行程</span>
        </button>
        <button type="button" onclick="setTab('tools')" id="nav-tools" class="flex-1 py-3 flex flex-col items-center gap-0.5 rounded-[2rem] text-muted">
            <span class="nav-emoji" aria-hidden="true">🧸</span>
            <span class="nav-tab-label">工具</span>
        </button>
    </nav>

    <div id="settings-sheet" class="hidden" role="dialog" aria-label="設定" onclick="if(event.target===this)closeSettingsSheet()">
        <div class="sheet sheet-tall settings-sheet-body" onclick="event.stopPropagation()">
            <p class="type-caption text-muted mb-1">設定</p>
            <div id="tools-cloud-card" class="hidden bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm space-y-3">
                <h2 class="type-body font-bold text-primary"><span class="cute-emoji" aria-hidden="true">☁️</span>雲端同步</h2>
                <form id="cloud-signed-out" class="space-y-2" onsubmit="event.preventDefault(); cloudSignIn();">
                    <label for="cloud-email" class="sr-only">Email</label>
                    <input type="email" id="cloud-email" class="field-input w-full" placeholder="Email" autocomplete="username" required>
                    <label for="cloud-password" class="sr-only">密碼</label>
                    <input type="password" id="cloud-password" class="field-input w-full" placeholder="密碼" autocomplete="current-password" required>
                    <button type="submit" id="cloud-signin-btn" class="w-full btn-primary-sm py-3"><i class="fas fa-right-to-bracket mr-1" aria-hidden="true"></i>登入</button>
                </form>
                <div id="cloud-signed-in" class="hidden space-y-2">
                    <p class="type-caption text-secondary">已登入：<strong id="cloud-user-email" class="text-primary"></strong></p>
                    <p id="cloud-status" class="type-micro text-muted font-bold"></p>
                    <div class="flex gap-2">
                        <button type="button" onclick="cloudSync()" class="flex-1 btn-primary-sm py-3"><i class="fas fa-rotate mr-1" aria-hidden="true"></i>立即同步</button>
                        <button type="button" onclick="cloudSignOut()" class="flex-1 btn-ghost-sm py-3">登出</button>
                    </div>
                </div>
            </div>

            <div id="tools-backup-card" class="bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm space-y-3">
                <h2 class="type-body font-bold text-primary"><span class="cute-emoji" aria-hidden="true">💾</span>備份</h2>
                <p id="backup-last" class="type-micro text-muted font-bold"></p>
                <div class="flex gap-2">
                    <button type="button" onclick="exportBackup()" class="flex-1 btn-primary-sm py-3"><i class="fas fa-download mr-1" aria-hidden="true"></i>匯出備份</button>
                    <button type="button" id="backup-share-btn" onclick="shareBackup()" class="hidden flex-1 btn-ghost-sm py-3"><i class="fas fa-share-alt mr-1" aria-hidden="true"></i>分享備份檔</button>
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="startImport('merge')" class="flex-1 btn-ghost-sm py-3">匯入（合併）</button>
                    <button type="button" onclick="startImport('replace')" class="flex-1 btn-ghost-sm py-3">匯入（取代）</button>
                </div>
            </div>
            <div id="tools-travelmode-card" class="bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm">
                <label class="setting-row">
                    <span class="type-body font-heavy text-primary"><span class="cute-emoji" aria-hidden="true">🧳</span>出門模式</span>
                    <span class="setting-toggle">
                        <input type="checkbox" id="travel-mode-toggle" onchange="onTravelModeToggle(this.checked)" class="setting-toggle-input">
                        <span class="setting-toggle-track" aria-hidden="true"></span>
                    </span>
                </label>
            </div>

            <div id="tools-appearance-card" class="bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm">
                <label class="setting-row">
                    <span class="type-body font-heavy text-primary"><span class="cute-emoji" aria-hidden="true">🌙</span>深色模式</span>
                    <button type="button" id="theme-toggle-btn" onclick="toggleDarkMode()" class="setting-theme-btn" aria-pressed="false" aria-label="切換深色模式">
                        <i id="theme-toggle-icon" class="fas fa-moon" aria-hidden="true"></i>
                    </button>
                </label>
            </div>

            <div id="tools-reminders-card" class="bg-surface p-5 rounded-[1.5rem] border border-default shadow-sm space-y-3">
                <h2 class="type-body font-bold text-primary"><span class="cute-emoji" aria-hidden="true">⏰</span>出發提醒</h2>
                <label class="setting-row">
                    <span class="type-body font-bold text-primary">開啟提醒</span>
                    <span class="setting-toggle">
                        <input type="checkbox" id="reminder-enabled" onchange="onReminderSettingsChange()" class="setting-toggle-input">
                        <span class="setting-toggle-track" aria-hidden="true"></span>
                    </span>
                </label>
                <label class="setting-row">
                    <span class="type-caption text-secondary">出發前／當日</span>
                    <span class="setting-toggle">
                        <input type="checkbox" id="reminder-departure" onchange="onReminderSettingsChange()" class="setting-toggle-input">
                        <span class="setting-toggle-track" aria-hidden="true"></span>
                    </span>
                </label>
                <div class="flex items-center gap-2 type-caption">
                    <span class="font-bold text-gray-600 shrink-0">每日</span>
                    <select id="reminder-hour" onchange="onReminderSettingsChange()" class="bg-pink-50 rounded-xl px-3 py-2 outline-none font-bold text-pink-600 min-h-[2.75rem]">
                        <option value="7">7:00</option>
                        <option value="8" selected>8:00</option>
                        <option value="9">9:00</option>
                        <option value="10">10:00</option>
                    </select>
                </div>
            </div>

            <div id="storage-warning" class="hidden bg-red-50 p-4 rounded-2xl border border-red-200 type-caption font-bold text-red-600 leading-relaxed"></div>

            <div class="tools-advanced-bar">
                <button type="button" id="tools-advanced-btn" onclick="closeSettingsSheet();toggleToolsAdvancedMenu()" class="tools-settings-toggle w-full" aria-label="進階選項" aria-expanded="false" aria-controls="tools-advanced-menu">
                    <span>進階選項</span>
                    <i class="fas fa-ellipsis" aria-hidden="true"></i>
                </button>
            </div>
            <button type="button" class="type-caption text-muted mt-1 w-full min-h-[2.75rem]" onclick="closeSettingsSheet()">完成</button>
        </div>
    </div>

    <div id="quick-add-sheet" class="hidden" role="dialog" aria-labelledby="quick-add-title" onclick="if(event.target===this)closeQuickAdd()">
        <form class="sheet" onclick="event.stopPropagation()" onsubmit="event.preventDefault(); submitQuickAdd();">
            <p id="quick-add-title" class="type-body font-heavy text-primary mb-3">加景點</p>
            <label class="event-edit-sheet-field">
                <span class="type-micro text-muted">景點名</span>
                <input type="text" id="qa-loc" class="field-input w-full mt-1" placeholder="例：淺草寺" autocomplete="off" enterkeyhint="done">
            </label>
            <label class="event-edit-sheet-field">
                <span class="type-micro text-muted">時間</span>
                <input type="time" id="qa-time" class="field-input w-full mt-1">
            </label>
            <button type="submit" class="btn-primary-sm w-full py-3 mt-3">加 ✨</button>
            <button type="button" class="type-caption text-muted mt-2 w-full min-h-[2.75rem]" onclick="closeQuickAdd()">取消</button>
        </form>
    </div>

    <div id="undo-toast" class="undo-toast" role="status" aria-live="polite">
        <span class="undo-toast-text"></span>
        <button type="button" onclick="undoLast()">復原</button>
    </div>

    <div id="stay-sheet" class="hidden" role="dialog" aria-labelledby="stay-sheet-title" onclick="if(event.target===this)closeStaySheet()">
        <div class="sheet sheet-tall" onclick="event.stopPropagation()">
            <p id="stay-sheet-title" class="type-body font-heavy text-primary mb-3">加住宿</p>
            <label class="event-edit-sheet-field">
                <span class="type-micro text-muted">名稱</span>
                <input type="text" id="stay-name" class="field-input w-full mt-1" placeholder="例：上野 APA 酒店">
            </label>
            <label class="event-edit-sheet-field">
                <span class="type-micro text-muted">地址</span>
                <input type="text" id="stay-address" class="field-input w-full mt-1" placeholder="例：東京都台東区上野 1-2-3">
            </label>
            <div class="flex gap-2">
                <label class="event-edit-sheet-field flex-1">
                    <span class="type-micro text-muted">入住</span>
                    <select id="stay-start" class="field-input w-full mt-1"></select>
                </label>
                <label class="event-edit-sheet-field w-24">
                    <span class="type-micro text-muted">晚數</span>
                    <input type="number" id="stay-nights" min="1" class="field-input w-full mt-1" inputmode="numeric">
                </label>
            </div>
            <label class="event-edit-sheet-field">
                <span class="type-micro text-muted">訂位編號</span>
                <input type="text" id="stay-ref" class="field-input w-full mt-1" placeholder="訂位編號">
            </label>
            <label class="event-edit-sheet-field">
                <span class="type-micro text-muted">房費 <span id="stay-cost-currency">JPY</span></span>
                <input type="number" id="stay-cost" class="field-input w-full mt-1" inputmode="decimal">
            </label>
            <div class="flex gap-2 mt-3">
                <button type="button" id="stay-delete-btn" onclick="deleteStayFromSheet()" class="btn-inline btn-inline-danger hidden">刪除</button>
                <button type="button" onclick="saveStayFromSheet()" class="btn-primary-sm flex-1 py-3">儲存</button>
            </div>
            <button type="button" class="type-caption text-muted mt-2 w-full min-h-[2.75rem]" onclick="closeStaySheet()">取消</button>
        </div>
    </div>

    <div id="tools-advanced-menu" class="hidden" role="dialog" aria-label="進階選項" onclick="if(event.target===this)closeToolsAdvancedMenu()">
        <div class="sheet" onclick="event.stopPropagation()">
            <p class="type-caption text-muted mb-3">進階選項</p>
            <button type="button" onclick="closeToolsAdvancedMenu();cleanupUnusedImages()" class="btn-ghost-sm w-full py-3 mb-2">清理未使用圖片</button>
            <button type="button" onclick="closeToolsAdvancedMenu();resetAll()" class="btn-danger-solid w-full">重設所有數據</button>
            <button type="button" class="type-caption text-muted mt-3 w-full min-h-[2.75rem]" onclick="closeToolsAdvancedMenu()">取消</button>
        </div>
    </div>

    <div id="event-edit-picker" class="hidden" role="dialog" aria-label="編輯景點" onclick="if(event.target===this)closeEventEditSheet()">
        <div class="sheet sheet-tall" onclick="event.stopPropagation()">
            <p class="type-caption text-muted mb-1">編輯景點</p>
            <p id="event-edit-picker-loc" class="type-body font-bold text-primary mb-3 truncate"></p>
            <div id="event-edit-picker-body" class="event-edit-sheet-body"></div>
            <button type="button" class="type-caption text-muted mt-3 w-full min-h-[2.75rem]" onclick="closeEventEditSheet()">完成</button>
        </div>
    </div>

    <div id="trip-date-picker" class="hidden" role="dialog" aria-label="選擇行程日期" onclick="if(event.target===this)closeTripDatePicker()">
        <div class="sheet sheet-tall" onclick="event.stopPropagation()">
            <p class="type-caption text-muted mb-1">選擇行程日期</p>
            <p id="trip-date-picker-hint" class="type-micro text-muted mb-3">先選出發日期</p>
            <div id="trip-date-picker-cal" class="trip-date-cal"></div>
            <div class="trip-date-picker-actions">
                <button type="button" onclick="clearTripDateRangeDraft()" class="btn-ghost-sm">清除</button>
                <button type="button" onclick="confirmTripDateRange()" class="btn-primary-sm flex-1">確定</button>
            </div>
            <button type="button" class="type-caption text-muted mt-2 w-full min-h-[2.75rem]" onclick="closeTripDatePicker()">取消</button>
        </div>
    </div>

    <div id="event-status-picker" class="hidden" role="dialog" aria-label="景點狀態" onclick="if(event.target===this)closeEventStatusPicker()">
        <div class="sheet" onclick="event.stopPropagation()">
            <p class="type-caption text-muted mb-1">景點狀態</p>
            <p id="event-status-picker-loc" class="type-body font-bold text-primary mb-3 truncate"></p>
            <div id="event-status-picker-options" class="status-picker-options"></div>
            <button type="button" class="type-caption text-muted mt-2 w-full min-h-[2.75rem]" onclick="closeEventStatusPicker()">取消</button>
        </div>
    </div>

    <div id="app-modal" class="hidden fixed inset-0 z-[200] flex items-end sm:items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="absolute inset-0 bg-black/40" data-modal-dismiss></div>
        <div class="relative w-full max-w-sm bg-white rounded-[2rem] p-6 shadow-2xl border border-pink-50">
            <h3 id="modal-title" class="type-body font-heavy text-primary mb-2"></h3>
            <p id="modal-message" class="hidden type-caption text-secondary mb-4 leading-relaxed"></p>
            <input id="modal-input" type="text" class="hidden w-full bg-pink-50 rounded-xl px-3 py-2.5 type-body font-heavy outline-none focus:ring-2 focus:ring-pink-200 mb-4">
            <div class="flex gap-2">
                <button type="button" id="modal-cancel" class="flex-1 py-3 rounded-2xl type-caption font-heavy text-secondary bg-gray-50">取消</button>
                <button type="button" id="modal-confirm" class="btn-inverse flex-1 py-3 rounded-2xl type-caption font-heavy">確定</button>
            </div>
        </div>
    </div>

    <div id="print-preview" class="hidden print-preview" role="dialog" aria-label="列印預覽">
        <div class="print-preview-bar">
            <button type="button" onclick="closePrintPreview()" class="print-preview-back"><i class="fas fa-arrow-left" aria-hidden="true"></i> 返回</button>
            <span class="print-preview-title">行程預覽</span>
            <button type="button" onclick="runPrintPreview()" class="print-preview-print"><i class="fas fa-print" aria-hidden="true"></i> 列印／PDF</button>
        </div>
        <iframe id="print-preview-frame" class="print-preview-frame" title="列印預覽"></iframe>
    </div>

    <div id="onboarding" class="onboarding" role="dialog" aria-modal="true" aria-label="新手引導" aria-hidden="true">
        <div class="onboarding-card">
            <div id="onboarding-dots" class="onboarding-dots"></div>
            <div id="onboarding-body"></div>
            <div class="onboarding-actions">
                <button type="button" id="onboarding-back" class="btn-ghost-sm hidden" onclick="onboardingBack()">上一步</button>
                <button type="button" class="btn-ghost-sm" onclick="skipOnboarding()">跳過</button>
                <button type="button" id="onboarding-next" class="btn-primary-sm flex-1" onclick="onboardingNext()">下一步</button>
            </div>
        </div>
    </div>

    <script src="js/share-print.js"></script>
    <script src="js/reminders.js"></script>
    <script src="js/weather-locations.js"></script>
    <script src="js/demo-data.js"></script>
    <script src="js/onboarding.js"></script>
    <script src="js/ui-ux.js"></script>
    <script src="app.js"></script>
    <script src="js/trip-calendar.js"></script>
    <script src="js/stays.js"></script>
    <script src="vendor/sortable/Sortable.min.js"></script>
    <script src="js/drag-sort.js"></script>
    <script src="js/backup.js"></script>
    <script src="vendor/supabase/supabase.js"></script>
    <script src="js/cloud-config.js"></script>
    <script src="js/cloud-sync.js"></script>
</body>
</html>
